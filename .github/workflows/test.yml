name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: read
      statuses: read
      checks: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run Tests
      run: go test -race -count=3 -coverprofile=coverage.out ./...

    - name: Check test coverage
      run: |
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${coverage}%"
        # Optionally fail if coverage is below threshold
        if (( $(echo "$coverage < 90" | bc -l) )); then
          echo "Coverage is below 90%"
          exit 1
        fi

    - name: Generate Coverage Badge
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        go install github.com/AlexBeauchemin/gobadge@latest
        go tool cover -func=coverage.out -o=coverage.out
        gobadge -filename=coverage.out

    - name: Create Pull Request
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peter-evans/create-pull-request@v8
      with:
        base: main
        branch: automation/coverage-badge
        title: "chore: update coverage badge"
        body: "Automated update of coverage badge."
        commit-message: "chore: update coverage badge [skip ci]"
        add-paths: |
          README.md

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"
        install-go: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Build binary
      run: go build -v -o probixel ./cmd

    - name: Upload binary
      uses: actions/upload-artifact@v6
      with:
        name: probixel-binary
        path: probixel
