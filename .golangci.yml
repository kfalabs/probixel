version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  build-tags:
    - development
    - migration
    - openapi

linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - govet
    - ineffassign
    - gosec
    - nestif
    - noctx
    - revive
    - staticcheck
    - unparam
    - unused
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.Closer).Close
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck
        - G115 # integer overflow on terminal fd / uint conversions
        - G117 # exported config struct fields named Password/Secret
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - revive
        text: "unused-parameter"
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
