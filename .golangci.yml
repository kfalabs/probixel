version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose     # Check for unclosed http responses
    - errcheck      # Check for unchecked errors
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - nestif        # Detect nested if statements that can be flattened
    - noctx         # Detect passing http.Request.Context() or http.ResponseWriter without custom context
    - staticcheck   # Static analysis
    - unused        # Check for unused code
    - misspell      # Check for misspelled words
    - gosec         # Security-focused linter
    - revive        # Fast and drop-in replacement for golint
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.Closer).Close
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
    govet:
      disable:
        - fieldalignment
    gosec:
      # G104 is often too noisy as it flags every unchecked error which errcheck already handles
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - revive
        text: "unused-parameter"
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
